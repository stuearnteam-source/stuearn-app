name: Build PayHive APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Source ZIP
        run: |
          wget --load-cookies /tmp/cookies.txt "https://drive.google.com/uc?export=download&confirm=$(wget --quiet --save-cookies /tmp/cookies.txt --keep-session-cookies --no-check-certificate 'https://drive.google.com/uc?export=download&id=1HU30eI1T-mOktxL76nT_va5FfbddaGBf' -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1\n/p')&id=1HU30eI1T-mOktxL76nT_va5FfbddaGBf" -O StuEarn.zip
          unzip StuEarn.zip -d source

      - name: Find project root
        run: |
          GRADLEW=$(find source -name "gradlew" | head -1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          PROJECT_DIR=$(dirname $GRADLEW)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Update API URL
        run: |
          sed -i 's|API_URL=.*|API_URL="YUhSMGNITTZMeTl0WVhKdmIyNHRabXhoYldsdVoyOHROekt6TmpnNExtaHZjM1JwYm1kbGNuTnBkR1V1WTI5dEx3PT0="|g' $PROJECT_DIR/gradle.properties

      - name: Update App Name
        run: |
          # Update app name in strings
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">PayHive</string>|g' $PROJECT_DIR/app/src/main/res/values/strings.xml
          # Update package name in google-services.json to match
          cat $PROJECT_DIR/app/google-services.json | sed 's|"com.app.stuearn"|"com.app.payhive"|g' > /tmp/gs.json
          cp /tmp/gs.json $PROJECT_DIR/app/google-services.json
          echo "Done - google-services updated"
          cat $PROJECT_DIR/app/google-services.json | grep package_name
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore payhive.jks \
            -alias payhive \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass PayHive@2025 \
            -keypass PayHive@2025 \
            -dname "CN=PayHive, OU=PayHive, O=PayHive, L=India, ST=India, C=IN"

      - name: Make gradlew executable
        run: chmod +x $PROJECT_DIR/gradlew

      - name: Build Release APK
        run: |
          cd $PROJECT_DIR
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/payhive.jks \
            -Pandroid.injected.signing.store.password=PayHive@2025 \
            -Pandroid.injected.signing.key.alias=payhive \
            -Pandroid.injected.signing.key.password=PayHive@2025
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PayHive-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/
          retention-days: 30

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: PayHive-Keystore
          path: payhive.jks
          retention-days: 30
